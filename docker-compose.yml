# TTRPG Tavern dev compose
#
# Default profile (no `--profile` flag) brings up only the supporting services
# (currently just Qdrant). Run the Node app on the host with `npm start`.
#
# Profile `app` brings up the full stack including the TTRPG Tavern Node app.
# Profile `llm` brings up a local LLM provider (Ollama) on :11434 with GPU
# acceleration. The GM core's LLM client speaks Ollama's OpenAI-compatible
# `/v1/chat/completions` endpoint directly.
#
# Usage:
#   docker compose up qdrant                                    # only Qdrant (recommended for dev)
#   docker compose --profile llm up -d ollama ollama-init       # local LLM, model auto-pulled
#   docker compose --profile app up                             # full stack (Node app + Qdrant)
#   docker compose --profile app --profile llm up               # full stack + local LLM
#   docker compose down -v                                      # stop and wipe named volumes
#
# Notes on the `llm` profile:
#   - First boot of `ollama-init` pulls TTRPG_OLLAMA_MODEL (default
#     `qwen2.5:14b`, ~9 GB). Qwen2.5 14B is currently the best balance of
#     structured-output / tool-calling reliability vs. VRAM footprint for
#     our Director loop. Override with `TTRPG_OLLAMA_MODEL=...` in the env
#     to swap (e.g. `qwen2.5:7b` for fast iteration on smaller GPUs, or
#     `qwen2.5:32b`/`llama3.1:70b` for higher quality if you have the VRAM).
#   - Subsequent restarts are no-ops because the model is cached in the
#     `ollama-data` volume.
#   - GPU is auto-attached via the nvidia runtime when present. If you don't
#     have a CUDA setup, comment out `runtime: nvidia` and the `deploy` block
#     and Ollama will fall back to CPU (slow but works for smoke testing).
#
# State on disk:
#   ./data                  -- ST/TTRPG user data (campaigns, characters, sheets, lore/, *.jsonl mirrors)
#   qdrant-data:/...        -- Qdrant collections (Phase 7 schema):
#                              world_lore__{cid}, character_memory__{cid}__{char_id},
#                              director_memory__{cid}, narrator_memory__{cid},
#                              player_journal__{cid}.
#                              Disk under ./data is canonical; this volume is a
#                              rebuildable index. `POST /api/gm/rag/reconcile`
#                              replays disk JSONL → Qdrant if this volume is wiped.
#   qdrant-snapshots:/...   -- Qdrant snapshot exports (`POST /collections/.../snapshots`).
#   ollama-data:/...        -- Pulled Ollama models (persists across `compose down`)
#
# Qdrant URL config:
#   - Host (Node app via `npm start`): http://localhost:6333  (the default
#     when TTRPG_QDRANT_URL is unset).
#   - Inside the `app` profile container: http://qdrant:6333  (set via
#     `TTRPG_QDRANT_URL` env in the `ttrpgtavern` service below).
#   - To force a different URL on the host, export TTRPG_QDRANT_URL before
#     `npm start`. The RAG service falls back to the deterministic embedder
#     and skips Qdrant writes if the URL is unreachable, so dev without
#     Qdrant is supported (memory mirrors still write to disk).

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ttrpgtavern-qdrant
    restart: unless-stopped
    # Bump nofile so test suites that churn dozens of collections per run
    # don't trip Qdrant's segment flush on the 1024 default. 65k matches
    # the limits Qdrant's docs recommend for production deployments.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    healthcheck:
      # The qdrant image's `sh` does not support /dev/tcp redirection and
      # the slim image has no curl/wget/nc. Walk /proc looking for the
      # `qdrant` binary instead — it's always spawned by the entrypoint
      # script. Tolerant, dependency-free, and fast.
      test: ["CMD", "sh", "-c", "grep -alq qdrant /proc/[0-9]*/comm 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ttrpgtavern

  # Local LLM provider — Ollama, exposing OpenAI-compatible /v1/chat/completions
  # at http://localhost:11434/v1. Pair with the `ollama-init` service to
  # auto-pull a default model on first boot.
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: ttrpgtavern-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama-data:/root/.ollama
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - ttrpgtavern

  # Pulls TTRPG_OLLAMA_MODEL on first boot so the LLM is ready to serve as
  # soon as `ollama` is healthy. Idempotent: re-running is a no-op once the
  # model is cached in the `ollama-data` volume.
  ollama-init:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: ttrpgtavern-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TTRPG_OLLAMA_MODEL=${TTRPG_OLLAMA_MODEL:-qwen2.5:14b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo "[ollama-init] ensuring model: $${TTRPG_OLLAMA_MODEL}";
        if ollama list 2>/dev/null | awk 'NR>1{print $$1}' | grep -Fxq "$${TTRPG_OLLAMA_MODEL}"; then
          echo "[ollama-init] already cached";
        else
          echo "[ollama-init] pulling $${TTRPG_OLLAMA_MODEL} ...";
          ollama pull "$${TTRPG_OLLAMA_MODEL}";
        fi;
        echo "[ollama-init] done"
    restart: "no"
    networks:
      - ttrpgtavern

  # Full-stack profile. Most dev should run the Node app on the host
  # (`npm install && npm start`) and just `docker compose up qdrant` separately.
  ttrpgtavern:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ttrpgtavern-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    # Host port is configurable via `TTRPG_HOST_PORT`; defaults to 8001 to
    # avoid clashing with hosts that already expose Portainer / dev services
    # on 8000. The container always listens on 8000 internally.
    ports:
      - "${TTRPG_HOST_PORT:-8001}:8000"
    environment:
      - NODE_ENV=production
      - TTRPG_QDRANT_URL=http://qdrant:6333
      - SILLYTAVERN_WHITELISTMODE=false
      - SILLYTAVERN_BASICAUTHMODE=false
      - SILLYTAVERN_SECURITYOVERRIDE=true
    volumes:
      - ./data:/home/node/app/data
      - ./plugins:/home/node/app/plugins
      - ./public/scripts/extensions/third-party:/home/node/app/public/scripts/extensions/third-party
      # Mount the host's config.yaml so per-environment toggles (whitelist
      # ranges for the docker bridge, model defaults) survive container
      # rebuilds. The Dockerfile leaves `config.yaml` as a symlink to
      # `./config/config.yaml`; the entrypoint copies the bundled default
      # if neither is present.
      - ./config.yaml:/home/node/app/config/config.yaml
    networks:
      - ttrpgtavern

networks:
  ttrpgtavern:
    driver: bridge

volumes:
  qdrant-data:
  qdrant-snapshots:
  ollama-data:
